<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CASPER-03 // CENTRAL DOGMA ARCHIVE</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Shippori+Mincho:wght@600;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<style>
:root{
  --bg: #f4f1ea; --side: #ece8de; --page: #fffffff2; --text: #1c1c1c; --dim: #6f695c;
  --accent: #c2410c; --accent2: #0f766e; --line: #00000024; --onacc: #fff; --dimmer: .55;
  --fs: 18px; --hf: var(--serif); --hsc: 1;
  --wf: system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Share Tech Mono", ui-monospace, Menlo, monospace;
  --serif: "Shippori Mincho", "Hiragino Mincho ProN", Georgia, serif;
  color-scheme: light; box-sizing: border-box;
  padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}
:root[data-theme=nerv]{--bg:#070605;--side:#0d0a08;--page:#12100eee;--text:#ece3d2;--dim:#85796a;--accent:#ff6a00;--accent2:#00e08a;--line:#ffffff1c;--onacc:#000;color-scheme:dark}
:root[data-theme=unit01]{--bg:#06030c;--side:#0e0818;--page:#120a1eee;--text:#ece4ff;--dim:#8a79b0;--accent:#a855f7;--accent2:#8cff1a;--line:#ffffff1c;--onacc:#000;color-scheme:dark}
:root[data-theme=unit02]{--bg:#090303;--side:#140707;--page:#190909ee;--text:#ffece4;--dim:#a07a6e;--accent:#ff3a22;--accent2:#ffb000;--line:#ffffff1c;--onacc:#000;color-scheme:dark}
:root[data-theme=seele]{--bg:#020202;--side:#080808;--page:#0d0dee;--text:#e2e2e2;--dim:#777777;--accent:#d4af37;--accent2:#ffffff;--line:#ffffff18;--onacc:#000;color-scheme:dark}

*{box-sizing:border-box;scrollbar-width:thin;scrollbar-color:var(--accent) transparent}
html,body{height:100%;margin:0}
body{height:calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));background:var(--bg);color:var(--text);font-family:var(--mono);overflow:hidden}
body[data-font=serif]{--wf:var(--serif)}
body[data-font=mono]{--wf:var(--mono)}

#bg{position:fixed;inset:0;background:center/cover no-repeat}
#veil{position:fixed;inset:0;background:var(--bg);opacity:var(--dimmer)}
#crt-overlay{position:fixed;inset:0;pointer-events:none;z-index:99;background:linear-gradient(rgba(18,16,14,0) 50%, rgba(0,0,0,0.15) 50%);background-size:100% 4px;opacity:0.3;display:block}
body[data-crt=off] #crt-overlay{display:none}

#bd{position:fixed;inset:0;z-index:9;background:#000a;display:none}
#app{position:relative;height:100%;display:grid;grid-template-columns:280px minmax(0,1fr)}
body.nosb #app{grid-template-columns:0 minmax(0,1fr)}
body.nosb #sb{display:none}

/* Pocket Mode Styles */
body.pocket-mode #sb{display:none!important}
body.pocket-mode #app{grid-template-columns:1fr!important}
body.pocket-mode #top{padding:4px 8px;font-size:10px}
body.pocket-mode #top button{padding:2px 6px;font-size:10px;min-height:24px}
body.pocket-mode #title{font-size:20px;padding:12px 16px 2px}
body.pocket-mode #bar{padding:2px 12px 4px}
body.pocket-mode #ed{padding:8px 16px 80px;font-size:15px}
body.pocket-mode #st{padding:4px 8px;font-size:10px}

#sb{position:relative;background:var(--side);border-right:2px solid var(--accent);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.hz{height:7px;flex:none;background:repeating-linear-gradient(-45deg,var(--accent) 0 9px,#000 9px 18px)}
.logo{padding:12px 14px 6px;font:800 22px/1 var(--serif);color:var(--accent)}
.logo small{display:block;font:9px var(--mono);letter-spacing:.25em;color:var(--accent2);margin-top:4px}
.sbtn{display:flex;gap:6px;padding:6px 12px}
.sbtn button{flex:1}

button,select,label.b,input[type=text],input[type=password]{background:transparent;color:var(--text);border:1px solid var(--line);font:12px var(--mono);padding:5px 9px;cursor:pointer;border-radius:0}
button:hover,label.b:hover{background:var(--accent);color:var(--onacc);border-color:var(--accent)}
body[data-cr=cut] :is(button,label.b){clip-path:polygon(6px 0,100% 0,100% calc(100% - 6px),calc(100% - 6px) 100%,0 100%,0 6px)}
:focus-visible{outline:2px solid var(--accent2);outline-offset:2px}
body[data-cr=cut] :is(button,label.b):focus-visible{outline:0;box-shadow:inset 0 0 0 2px var(--accent2)}

#q{margin:2px 12px 6px;width:calc(100% - 24px);cursor:text;font-size:13px}
#tree{flex:1;overflow:auto;padding:4px 6px 20px;overscroll-behavior:contain}
.row{display:flex;align-items:center;gap:6px;padding:6px 8px;font-size:14px;cursor:pointer;border-left:3px solid transparent;user-select:none;white-space:nowrap}
.row .nm{flex:1;overflow:hidden;text-overflow:ellipsis}
.row .ic{color:var(--accent);width:14px;text-align:center}
.row:hover{background:color-mix(in srgb,var(--accent) 8%,transparent)}
.row.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--accent)}
.row.sel{background:color-mix(in srgb,var(--text) 8%,transparent)}
.row.dr{outline:1px dashed var(--accent2)}
.row .ac{display:none;gap:2px}
.row:hover .ac,.row:focus-within .ac{display:flex}
.ac span{padding:0 4px;color:var(--dim)}
.ac span:hover{color:var(--accent2)}
.ac .arm{color:#fff;background:#d33}
.row input{flex:1;min-width:0;padding:1px 4px;font-size:14px}
.sub{font-size:11px;color:var(--dim);padding:0 12px 6px 28px}
.sfoot{border-top:1px solid var(--line);padding:8px 12px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sfoot button,.sfoot label{font-size:11px;padding:3px 7px}

#main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
#top{display:flex;align-items:center;gap:8px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--side);font-size:12px;color:var(--dim);flex:none}
#crumb{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:.08em}
#crumb b{color:var(--accent)}
#pdfb{background:var(--accent);color:var(--onacc);border-color:var(--accent)}

#stage{flex:1;min-height:0;display:flex;justify-content:center}
#page{width:100%;max-width:860px;background:var(--page);display:flex;flex-direction:column;min-height:0}
body[data-cr=cut] #page{clip-path:polygon(0 0,calc(100% - 24px) 0,100% 24px,100% 100%,24px 100%,0 calc(100% - 24px))}

#title{background:transparent;border:0;outline:0;color:var(--text);font:800 clamp(28px,4vw,42px)/1.15 var(--serif);padding:26px 34px 6px;width:100%}
#bar{display:flex;gap:2px;padding:4px 28px 8px;align-items:center;overflow-x:auto;scrollbar-width:none;flex:none;border-bottom:1px solid var(--line)}
#bar>*{flex:none}
#bar::-webkit-scrollbar{display:none}
#bar button{border:0;color:var(--dim);padding:4px 9px;font-size:13px}
#bar select{border:0;color:var(--dim);font-size:12px;padding:3px 4px}
#bar i{width:1px;height:18px;background:var(--line);margin:0 5px}

#shg{display:none;gap:2px;align-items:center;border:1px dashed var(--accent2);padding:0 4px;margin-left:6px}
#shg.on{display:flex}
#shg input{width:28px;height:24px;padding:0;border:0;background:none}

#lkb{display:flex;gap:6px;padding:6px 28px;border-bottom:1px solid var(--line)}
#lkb[hidden]{display:none}
#lkb input{flex:1;font-size:14px;cursor:text}

#edw{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain}
#ed{min-height:100%;padding:14px 34px 140px;outline:0;font:var(--fs)/1.8 var(--wf);caret-color:var(--accent2);word-wrap:break-word}
#ed:empty::before{content:attr(data-ph);color:var(--dim)}
#ed h1,#ed h2,#ed h3{font-family:var(--hf);font-weight:800;line-height:1.25;color:var(--accent);margin:1.2em 0 .4em}
#ed h1{font-size:calc(2em*var(--hsc))}
#ed h2{font-size:calc(1.55em*var(--hsc))}
#ed h3{font-size:calc(1.25em*var(--hsc))}

body[data-hc=upper] #ed :is(h1,h2,h3){text-transform:uppercase;letter-spacing:.03em}
body[data-hs=plain] #ed h2{border-bottom:1px solid var(--line);padding-bottom:4px}
body[data-hs=bracket] #ed :is(h1,h2,h3){border-left:7px solid var(--accent);padding-left:12px}
body[data-hs=block] #ed :is(h1,h2,h3){display:table;background:var(--accent);color:var(--onacc);padding:2px 22px 2px 12px;clip-path:polygon(0 0,100% 0,calc(100% - 12px) 100%,0 100%)}
body[data-hs=slash] #ed :is(h1,h2,h3)::before{content:"//";margin-right:.4em;opacity:.7}
body[data-hs=hazard] #ed :is(h1,h2,h3){padding-bottom:10px;background:repeating-linear-gradient(-45deg,var(--accent) 0 6px,transparent 6px 12px) left bottom/100% 5px no-repeat}
body[data-hs=boxed] #ed :is(h1,h2,h3){display:table;border:2px solid var(--accent);padding:2px 14px;box-shadow:5px 5px 0 var(--accent)}

#ed p{margin:.5em 0}
#ed blockquote{margin:14px 0;padding:4px 16px;border-left:5px solid var(--accent);background:color-mix(in srgb,var(--accent) 8%,transparent)}
#ed a{color:var(--accent2)}
#ed hr{border:0;border-top:2px dashed var(--accent);margin:18px 0}
#ed img{max-width:100%}
#ed table{border-collapse:collapse;width:100%}
#ed td,#ed th{border:1px solid var(--line);padding:8px 10px;min-width:60px}
#ed .box{margin:16px 0;padding:8px 22px;border-left:6px solid var(--accent);background:color-mix(in srgb,var(--accent) 9%,transparent);clip-path:polygon(0 0,calc(100% - 18px) 0,100% 18px,100% 100%,0 100%)}
#ed ul.todo{list-style:none;padding-left:4px}
#ed .todo input{accent-color:var(--accent);margin-right:8px;transform:scale(1.25)}

.shp{display:inline-block;vertical-align:middle;margin:4px 6px;cursor:pointer;line-height:0;user-select:none}
.shp svg{width:100%;height:auto;display:block}
.shp.wide{display:block;margin:14px 0}
.shp.selx{outline:2px dashed var(--accent2);outline-offset:3px}

body:not([data-hm=none]) #ed :is(h1,h2,h3)::before{content:"";display:inline-block;width:.55em;height:.55em;margin-right:.5em;background:currentColor;clip-path:var(--hm);opacity:1;vertical-align:.04em}
body:not([data-bm=none]) #ed ul:not(.todo){list-style:none;padding-left:1.5em}
body:not([data-bm=none]) #ed ul:not(.todo)>li{position:relative}
body:not([data-bm=none]) #ed ul:not(.todo)>li::before{content:"";position:absolute;left:-1.25em;top:.62em;width:.55em;height:.55em;background:var(--accent);clip-path:var(--bm)}

[hidden]{display:none!important}
#ptitle{display:none}

#st{display:flex;gap:16px;align-items:center;padding:6px 16px;background:var(--side);border-top:1px solid var(--accent);font-size:12px;color:var(--dim);flex:none;flex-wrap:wrap}
#st b{color:var(--accent2)}
#empty{margin:auto;color:var(--dim);text-align:center;padding:40px}

#sp{position:absolute;top:46px;right:14px;z-index:20;width:290px;max-height:calc(100dvh - 70px);overflow:auto;background:var(--side);border:2px solid var(--accent);padding:8px 14px 12px;box-shadow:6px 6px 0 var(--accent)}
#sp[hidden]{display:none}
#sp h4{margin:12px 0 6px;font:11px var(--mono);letter-spacing:.2em;color:var(--accent)}
#sp label{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:7px 0;font-size:12px}
#sp input[type=range]{width:120px;accent-color:var(--accent)}
#sp input[type=color]{width:46px;height:24px;padding:0;border:1px solid var(--line);background:none}

.rowb{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:52px;height:34px;padding:0;border:1px solid var(--line)}
.sw.on{outline:3px solid var(--accent2);outline-offset:1px}

/* Login Modal */
#login-modal{position:fixed;inset:0;background:#050403ee;z-index:999;display:flex;align-items:center;justify-content:center}
#login-box{background:var(--side);border:2px solid var(--accent);width:380px;max-width:90vw;padding:24px;box-shadow:8px 8px 0 var(--accent)}
#login-box h2{margin:0 0 4px;font:800 20px var(--serif);color:var(--accent)}
#login-box p{margin:0 0 16px;font-size:11px;color:var(--dim);letter-spacing:.1em}
#login-box input{width:100%;margin-bottom:12px;padding:8px;font-size:14px}
#login-box button{width:100%;padding:10px;background:var(--accent);color:var(--onacc);font-weight:bold;margin-top:4px}
.saved-users{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.saved-user-chip{font-size:10px;background:color-mix(in srgb,var(--accent) 15%,transparent);border:1px solid var(--accent);padding:3px 6px;cursor:pointer}

@media(hover:none){.row .ac{display:flex}}
@media(pointer:coarse){button,select,label.b{min-height:40px}.row{padding:11px 8px}.ac span{padding:4px 9px}#bar button{min-width:40px}}
@media(max-width:800px){
  #app{grid-template-columns:1fr}
  body.nosb #app{grid-template-columns:1fr}
  body.nosb #sb{display:flex}
  #sb{position:fixed;z-index:10;left:0;top:0;bottom:0;width:86%;max-width:320px;transform:translateX(-100%);transition:transform .2s}
  body.sbo #sb{transform:none}
  body.sbo #bd{display:block}
  #q,#rn,#lkb input,select{font-size:16px!important}
  body[data-cr=cut] #page{clip-path:none}
  #title{padding:18px 18px 4px}
  #ed{padding-left:18px;padding-right:18px}
  #bar,#lkb{padding-left:12px;padding-right:12px}
  #sp{position:fixed;left:8px;right:8px;top:auto;bottom:calc(8px + env(safe-area-inset-bottom,0px));width:auto;max-height:72dvh;box-shadow:none}
  #top{padding:6px 10px}
  #st>span:nth-child(2){display:none}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
@page{margin:18mm}
@media print{
  :root{--text:#111;--page:#fff;--line:#0003}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{overflow:visible;height:auto;background:#fff}
  #bg,#veil,#crt-overlay,#bd,#sb,#top,#bar,#lkb,#st,#sp,#title{display:none!important}
  #app,#main,#stage,#page,#edw{display:block;height:auto;overflow:visible;clip-path:none!important;background:#fff}
  #ptitle{display:block;font:800 30px var(--serif);margin:0 0 12px}
  #ed{padding:0;color:#111}
  .shp.selx{outline:0}
}
</style>
</head>
<body data-font="sans" data-hs="bracket" data-cr="cut" data-hm="none" data-bm="none" data-crt="on">
<div id="bg"></div>
<div id="veil"></div>
<div id="crt-overlay"></div>
<div id="bd"></div>

<!-- Login Screen Gate -->
<div id="login-modal" hidden>
  <div id="login-box">
    <h2>NERV // MAGI SECURITY</h2>
    <p>CENTRAL DOGMA DIRECTORY ACCESS</p>
    <div id="saved-users-list" class="saved-users"></div>
    <form id="login-form">
      <input type="text" id="l-user" placeholder="Operative Designation (e.g. Ikari G.)" required>
      <input type="password" id="l-pass" placeholder="Access Clearance PIN" required>
      <button type="submit">AUTHORIZE LOGIN</button>
    </form>
  </div>
</div>

<div id="app">
  <aside id="sb">
    <div class="hz"></div>
    <div class="logo">CASPER-03<small>CENTRAL DOGMA // ARCHIVE</small></div>
    <div class="sbtn">
      <button id="nn">+ Note</button>
      <button id="nf">+ Folder</button>
      <button id="of" title="Import folder">Open…</button>
    </div>
    <input type="text" id="q" aria-label="Search notes" placeholder="Search notes (Ctrl+P)">
    <div id="tree" role="tree" aria-label="Notes and folders"></div>
    <div class="sfoot">
      <label class="b">BG<input type="file" id="bgf" accept="image/*" hidden></label>
      <label class="b">Dim <input type="range" id="dim" min="0" max="95" style="width:50px;accent-color:var(--accent);vertical-align:middle"></label>
      <button id="bk">Backup</button>
      <label class="b">Restore<input type="file" id="rs" accept=".json" hidden></label>
      <button id="logout-btn" style="color:var(--accent2);width:100%">Operative: <span id="current-user-lbl">Gendo</span></button>
    </div>
  </aside>

  <div id="main" role="main">
    <div id="top">
      <button id="sbt" aria-label="Toggle sidebar">☰</button>
      <span id="crumb"></span>
      <button id="pocket-btn" title="Toggle Pocket Sticky Mode" style="background:var(--accent);color:var(--onacc);border-color:var(--accent)">🗗 Pocket</button>
      <button id="dk" title="Choose a folder on your computer for this note">Save to folder…</button>
      <button id="dsk-folder-btn" title="Save entire folder tree to PC">💾 Save Folders to PC</button>
      <button id="stb" aria-haspopup="true">Style</button>
      <button id="pdfb" title="Export as PDF">Export PDF</button>
    </div>

    <div id="sp" hidden>
      <h4>THEME</h4>
      <div class="rowb">
        <button class="sw" data-t="paper" aria-label="Paper theme" style="background:linear-gradient(135deg,#f4f1ea 50%,#c2410c 50%)"></button>
        <button class="sw" data-t="nerv" aria-label="NERV theme" style="background:linear-gradient(135deg,#0d0a08 50%,#ff6a00 50%)"></button>
        <button class="sw" data-t="unit01" aria-label="Unit-01 theme" style="background:linear-gradient(135deg,#0e0818 50%,#a855f7 50%)"></button>
        <button class="sw" data-t="unit02" aria-label="Unit-02 theme" style="background:linear-gradient(135deg,#140707 50%,#ff3a22 50%)"></button>
        <button class="sw" data-t="seele" aria-label="SEELE theme" style="background:linear-gradient(135deg,#020202 50%,#d4af37 50%)"></button>
      </div>

      <h4>DISPLAY</h4>
      <label>CRT Scanlines<select id="s-crt"><option value="on">Subtle Grid On</option><option value="off">Off (Crisp)</option></select></label>

      <h4>HEADINGS</h4>
      <label>Style<select id="s-hs"><option value="plain">Plain</option><option value="bracket">Bracket bar</option><option value="block">Solid block</option><option value="slash">Slash //</option><option value="hazard">Hazard underline</option><option value="boxed">Boxed + shadow</option></select></label>
      <label>Font<select id="s-hf"><option value="serif">Mincho serif</option><option value="sans">Sans</option><option value="mono">Mono</option></select></label>
      <label>Case<select id="s-hc"><option value="normal">Normal</option><option value="upper">UPPERCASE</option></select></label>
      <label>Size<input type="range" id="s-sc" min="70" max="140"></label>

      <h4>SHAPE MARKERS</h4>
      <label>Before headings<select id="s-hm"><option value="none">None</option><option value="hex">Hexagon</option><option value="arrow">Arrow</option><option value="diamond">Diamond</option><option value="chevron">Chevron</option><option value="slab">Slab</option><option value="square">Square</option><option value="notch">Notch</option></select></label>
      <label>Bullet points<select id="s-bm"><option value="none">Default dot</option><option value="hex">Hexagon</option><option value="arrow">Arrow</option><option value="diamond">Diamond</option><option value="chevron">Chevron</option><option value="slab">Slab</option><option value="square">Square</option><option value="notch">Notch</option></select></label>

      <h4>PAGE</h4>
      <label>Text font<select id="s-bf"><option value="sans">Sans</option><option value="serif">Serif</option><option value="mono">Mono</option></select></label>
      <label>Text size<input type="range" id="s-fs" min="14" max="26"></label>
      <label>Corners<select id="s-cr"><option value="cut">Cut (edgy)</option><option value="sharp">Square</option></select></label>
      <label>Accent<span><input type="color" id="s-ac" value="#c2410c"> <button id="s-rs">Reset</button></span></label>

      <h4>EXPORT</h4>
      <div class="rowb"><button id="pdf">PDF</button><button id="doc">Word (editable)</button></div>
      <button id="spx" style="width:100%;margin-top:10px">Close</button>
    </div>

    <div id="stage">
      <div id="page">
        <input type="text" id="title" aria-label="Note title" placeholder="Untitled">
        <div id="bar">
          <select id="blk" aria-label="Text style">
            <option value="p">Text</option>
            <option value="h1">Heading 1</option>
            <option value="h2">Heading 2</option>
            <option value="h3">Heading 3</option>
            <option value="blockquote">Quote</option>
          </select>
          <i></i>
          <span id="tb" style="display:contents"></span>
          <span id="shg">
            <button id="sm" aria-label="Smaller">−</button>
            <button id="sl" aria-label="Larger">+</button>
            <input type="color" id="shc" value="#c2410c" aria-label="Shape color">
            <button id="sd">Delete</button>
          </span>
        </div>
        <div id="lkb" hidden>
          <input type="text" id="lki" placeholder="Paste a link, then press Enter">
          <button id="lka">Apply</button>
        </div>
        <div id="edw">
          <div id="ptitle"></div>
          <div id="ed" contenteditable="true" spellcheck="true" role="textbox" aria-multiline="true" aria-label="Note" data-ph="Start writing… try typing # then space for a heading"></div>
        </div>
      </div>
      <div id="empty" hidden>No note open.<br><br><button id="nn2">+ New note</button></div>
    </div>

    <div id="st">

const clean=h=>{
  const d=new DOMParser().parseFromString(h,'text/html');
  d.querySelectorAll('script,iframe,object,embed,link,style,meta,title').forEach(x=>x.remove());
  d.body.querySelectorAll('*').forEach(e=>[...e.attributes].forEach(a=>{
    if(/^on/i.test(a.name)||/^\s*javascript:/i.test(a.value))e.removeAttribute(a.name)
  }));

};

const mig=()=>items.forEach(i=>{

const it=id=>items.find(i=>i.id===id);

function save(){

function path(n){
  const p=[];let c=n;
  while(c){p.unshift(c.name||'Untitled');c=c.parent?it(c.parent):null}

}
const plain=h=>{const d=document.createElement('div');d.innerHTML=h;return d.textContent.toLowerCase()};

// ---- tree ----
function tree(){
  const q=$('#q').value.trim().toLowerCase(), box=$('#tree');let h='';
  if(q){
    const m=items.filter(i=>i.type=='note'&&(i.name.toLowerCase().includes(q)||plain(i.html).includes(q)));
    h=m.map(n=>`<div class="row ${n.id==cur?'on':''}" data-id="${n.id}" tabindex="0" role="treeitem"><span class="ic">▫</span><span class="nm">${esc(n.name||'Untitled')}</span></div><div class="sub">${esc(path(it(n.parent)||{name:'/'}).join(' / '))}</div>`).join('')||'<div class="sub">No matches</div>';
  } else {
    const walk=(p,d)=>kids(p).forEach(i=>{
      const f=i.type=='folder', nm=ren==i.id?`<input type="text" id="rn" value="${esc(i.name)}">`:`<span class="nm">${esc(i.name||'Untitled')}</span>`;
      h+=`<div class="row ${i.id==cur?'on':''} ${i.id==selF?'sel':''}" data-id="${i.id}" draggable="true" tabindex="0" role="treeitem"${f?' aria-expanded="'+(!!i.open)+'"':''} style="padding-left:${8+d*16}px"><span class="ic">${f?(i.open?'▾':'▸'):'▫'}</span>${nm}<span class="ac">${f?'<span data-a="nn" title="New note here">+</span><span data-a="nf" title="New subfolder">▣</span><span data-a="sf" title="Save folder to PC">💾</span>':''}<span data-a="rn" title="Rename">✎</span><span data-a="dl" class="${arm==i.id?'arm':''}" title="Delete">${arm==i.id?'sure?':'×'}</span></span></div>`;
      if(f&&i.open)walk(i.id,d+1);
    });
    walk(null,0);
    if(!items.length)h='<div class="sub">Empty. Create a note or folder.</div>';
  }
  const fe=document.activeElement, fr=fe&&fe.closest?fe.closest('#tree .row'):null, fid=fr?fr.dataset.id:null;
  box.innerHTML=h;
  const r=$('#rn');
  if(r){r.focus();r.select()}else if(fid){const x=box.querySelector('.row[data-id="'+fid+'"]');if(x)x.focus()}
}

function add(type,parent){
  const i={id:uid(),type,parent,name:type=='folder'?'New folder':'Untitled'};
  if(type=='note')i.html='';else i.open=true;
  items.push(i);
  const p=it(parent);if(p)p.open=true;
  if(type=='note'){cur=i.id;selF=parent;openNote();save();tree();ti.focus();return}
  ren=i.id;save();tree();
}

const target=()=>{const n=note();return selF!==null&&it(selF)?selF:(n?n.parent:null)};

function del(id){
  const rm=new Set([id]);let ch=true;
  while(ch){ch=false;items.forEach(i=>{if(!rm.has(i.id)&&rm.has(i.parent)){rm.add(i.id);ch=true}})}
  items=items.filter(i=>!rm.has(i.id));
  if(rm.has(cur)){const n=items.find(i=>i.type=='note');cur=n?n.id:null}
  if(rm.has(selF))selF=null;
  save();openNote();tree();
}

  else if(a=='dl'){
    if(arm==id){arm=null;del(id)}

};

// ---- local folders & zip exports ----
const FS=!!window.showDirectoryPicker;
const idb=(m,k,v)=>new Promise((res,rej)=>{
  try{
    const o=indexedDB.open('casper',1);
    o.onupgradeneeded=()=>o.result.createObjectStore('h');
    o.onerror=()=>rej(o.error);
    o.onsuccess=()=>{
      const s=o.result.transaction('h',m=='get'?'readonly':'readwrite').objectStore('h'), r=m=='get'?s.get(k):s.put(v,k);
      r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);
    }
  }catch(e){rej(e)}
});

let binds={}, dT=null;
const saveBinds=()=>idb('set','binds',binds).catch(()=>{});
idb('get','binds').then(b=>{if(b){binds=b;diskStatus()}}).catch(()=>{});

const safe=s=>((s||'Untitled').replace(/[\\/:*?"<>|]+/g,'-').trim())||'Untitled';
async function okp(h,req){
  const o={mode:'readwrite'};
  if(await h.queryPermission(o)==='granted')return true;
  return req&&await h.requestPermission(o)==='granted';
}

const wrapDoc=n=>'<!DOCTYPE html><html><head><meta charset="utf-8"><title>'+esc(n.name)+'</title><style>:root{--accent:'+getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()+'}body{font:17px/1.7 system-ui;max-width:760px;margin:40px auto;padding:0 16px}</style></head><body>'+(n.html||'')+'</body></html>';

async function toDisk(n,req){
  const b=binds[n.id];if(!b)return;
  try{
    if(!await okp(b.dir,req)){b.need=true;diskStatus();return}
    b.need=false;
    const w=await(await b.dir.getFileHandle(b.file,{create:true})).createWritable();
    await w.write(wrapDoc(n));await w.close();
    diskStatus(1);
  }catch(e){$('#dsk').textContent='DISK ERROR: '+e.name}
}
const diskQ=n=>{if(binds[n.id]){clearTimeout(dT);dT=setTimeout(()=>toDisk(n,false),700)}};

function diskStatus(ok){
  const n=note(), b=n&&binds[n.id];
  $('#dk').textContent=!b?'Save to folder…':b.need?'Reconnect folder':'Change folder…';
  $('#dsk').textContent=b?(b.need?'DISK: CLICK RECONNECT':'DISK → '+b.dir.name+'/'+b.file+(ok?' ✓':'')): '';
}

const blocked=e=>{$('#dsk').textContent=e.name=='AbortError'?'':'FOLDER ACCESS BLOCKED'};
const noFS=()=>{$('#dsk').textContent='NOT SUPPORTED IN THIS BROWSER'};

async function saveFolderToPC(folderId){
  const folder=it(folderId);
  if(!folder||folder.type!=='folder')return;
  if(!FS){alert('Directory saving requires Chrome or Edge.');return;}
  try{
    const rootDir=await showDirectoryPicker({mode:'readwrite'});
    const exportSub=async(parentId, parentHandle)=>{
      const children=items.filter(i=>i.parent===parentId);
      for(const child of children){
        if(child.type==='folder'){
          const subHandle=await parentHandle.getDirectoryHandle(safe(child.name),{create:true});
          await exportSub(child.id, subHandle);
        } else if(child.type==='note'){
          const fileHandle=await parentHandle.getFileHandle(safe(child.name)+'.html',{create:true});
          const w=await fileHandle.createWritable();
          await w.write(wrapDoc(child));
          await w.close();
        }
      }
    };
    const targetDir=await rootDir.getDirectoryHandle(safe(folder.name),{create:true});
    await exportSub(folder.id, targetDir);
    $('#dsk').textContent='FOLDER "'+folder.name+'" SAVED TO PC ✓';
  }catch(e){if(e.name!=='AbortError')alert('Error saving folder: '+e.message);}
}

$('#dsk-folder-btn').onclick=async()=>{
  const n=note();
  const folderId=n&&n.parent?n.parent:(items.find(i=>i.type=='folder')||{}).id;
  if(folderId)saveFolderToPC(folderId);
  else alert('Please create a folder first to export to PC.');
};

$('#dk').onclick=async()=>{
  const n=note();if(!n)return;
  if(!FS)return noFS();
  const b=binds[n.id];if(b&&b.need){await toDisk(n,true);return}
  try{
    const dir=await showDirectoryPicker({mode:'readwrite'});
    binds[n.id]={dir,file:safe(n.name)+'.html'};
    saveBinds();await toDisk(n,true);
  }catch(e){blocked(e)}
};

$('#of').onclick=async()=>{
  if(!FS)return noFS();
  try{
    const dir=await showDirectoryPicker({mode:'readwrite'});
    let c=0; const root={id:uid(),type:'folder',parent:null,name:dir.name,open:true};
    items.push(root);
    const walk=async(d,pid,dp)=>{
      for await(const [nm,h] of d.entries()){
        if(nm[0]=='.')continue;
        if(h.kind=='directory'&&dp<4){
          const f={id:uid(),type:'folder',parent:pid,name:nm,open:false};
          items.push(f);await walk(h,f.id,dp+1);
        } else if(h.kind=='file'&&/\.(md|markdown|txt|html?)$/i.test(nm)&&c<500){
          const t=await(await h.getFile()).text();
          const x={id:uid(),type:'note',parent:pid,name:nm.replace(/\.[^.]+$/,''),html:/\.html?$/i.test(nm)?clean(t):clean(md(t))};
          items.push(x);binds[x.id]={dir:d,file:nm};c++;
        }
      }
    };
    await walk(dir,root.id,0);
    saveBinds();save();tree();
    $('#dsk').textContent='IMPORTED '+c+' FILES';
  }catch(e){blocked(e)}
};

// ---- style ----
const MK={
  hex:'polygon(25% 5%,75% 5%,100% 50%,75% 95%,25% 95%,0 50%)',
  arrow:'polygon(0 0,100% 50%,0 100%)',
  diamond:'polygon(50% 0,100% 50%,50% 100%,0 50%)',
  chevron:'polygon(0 0,55% 0,100% 50%,55% 100%,0 100%,45% 50%)',
  slab:'polygon(25% 0,100% 0,75% 100%,0 100%)',
  square:'polygon(0 0,100% 0,100% 100%,0 100%)',
  notch:'polygon(0 0,100% 0,100% 65%,65% 100%,0 100%)'
};

const SD={hs:'bracket',hf:'serif',hc:'normal',cr:'cut',sc:100,ac:'',bf:'sans',fs:18,hm:'hex',bm:'arrow',crt:'on'};
let sty={...SD,...st.get('casper-sty',{})};

function applySty(){
  const b=document.body, r=document.documentElement.style;
  b.dataset.hs=sty.hs; b.dataset.hc=sty.hc; b.dataset.cr=sty.cr;
  b.dataset.font=sty.bf; b.dataset.hm=sty.hm; b.dataset.bm=sty.bm; b.dataset.crt=sty.crt;
  r.setProperty('--hm',MK[sty.hm]||'none');
  r.setProperty('--bm',MK[sty.bm]||'none');
  r.setProperty('--hf',{serif:'var(--serif)',sans:'var(--wf)',mono:'var(--mono)'}[sty.hf]);
  r.setProperty('--hsc',sty.sc/100);
  r.setProperty('--fs',sty.fs+'px');
  if(sty.ac)r.setProperty('--accent',sty.ac); else r.removeProperty('--accent');
  st.set('casper-sty',sty);
}

[['hs','s-hs'],['hf','s-hf'],['hc','s-hc'],['cr','s-cr'],['sc','s-sc'],['bf','s-bf'],['fs','s-fs'],['hm','s-hm'],['bm','s-bm'],['crt','s-crt']].forEach(([k,id])=>{
  const e=$('#'+id);
  if(e){
    e.value=sty[k];
    e.oninput=e.onchange=()=>{sty[k]=['sc','fs'].includes(k)?+e.target.value:e.target.value;applySty()};
  }
});

$('#s-ac').oninput=e=>{sty.ac=e.target.value;applySty()};
$('#s-rs').onclick=()=>{sty.ac='';applySty()};

const setTheme=v=>{
  document.documentElement.dataset.theme=v;
  st.set('casper-th',v);
  document.querySelectorAll('.sw').forEach(b=>b.classList.toggle('on',b.dataset.t==v));
};
document.querySelectorAll('.sw').forEach(b=>b.onclick=()=>{sty.ac='';applySty();setTheme(b.dataset.t)});
setTheme(st.get('casper-th','nerv'));
applySty();

$('#stb').onclick=()=>{$('#sp').hidden=!$('#sp').hidden};
$('#spx').onclick=()=>{$('#sp').hidden=true};

const dim=$('#dim');
const setDim=v=>{document.documentElement.style.setProperty('--dimmer',v/100);st.set('mn2-dim',v)};
dim.oninput=()=>setDim(dim.value);
dim.value=st.get('mn2-dim',55);
setDim(dim.value);

const setBg=u=>$('#bg').style.backgroundImage=u?`url("${u}")`:'none';
$('#bgf').onchange=e=>{
  const f=e.target.files[0];
  if(f){
    const r=new FileReader();
    r.onload=()=>{setBg(r.result);st.set('casper-bg',r.result)||($('#sv').textContent='BG TOO BIG')};
    r.readAsDataURL(f);
  }
};
setBg(st.get('casper-bg',''));

// ---- ui + export ----
function toggleSb(){document.body.classList.toggle(innerWidth<=800?'sbo':'nosb')}
$('#sbt').onclick=toggleSb;
$('#bd').onclick=()=>document.body.classList.remove('sbo');

document.addEventListener('keydown',e=>{
  if(e.key=='Escape'){$('#sp').hidden=true;document.body.classList.remove('sbo')}
  if(e.ctrlKey||e.metaKey){
    const k=e.key.toLowerCase();
    if(k=='p'){e.preventDefault();if(document.body.classList.contains('nosb'))toggleSb();$('#q').focus()}
    if(k=='s'){e.preventDefault();save()}
  }
});
document.addEventListener('pointerdown',e=>{const sp=$('#sp');if(!sp.hidden&&!sp.contains(e.target)&&e.target.id!='stb')sp.hidden=true});

const dl=(n,t,m)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([t],{type:m}));a.download=n;a.click()};
const printIt=()=>{$('#sp').hidden=true;if(selShape){selShape.classList.remove('selx');selShape=null;shg()}setTimeout(()=>window.print(),120)};
$('#pdfb').onclick=printIt;
$('#pdf').onclick=printIt;

$('#doc').onclick=()=>{
  const n=note();if(!n)return;
  const c=ed.cloneNode(true);
  c.querySelectorAll('.shp').forEach(x=>x.remove());
  const a=getComputedStyle(document.documentElement).getPropertyValue('--accent').trim();
  dl(safe(n.name)+'.doc','<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word"><head><meta charset="utf-8"><style>body{font-family:Calibri,Arial;font-size:12pt}h1,h2,h3{color:'+a+'}td,th{border:1px solid #999;padding:4px}table{border-collapse:collapse}</style></head><body><h1>'+esc(n.name)+'</h1>'+c.innerHTML+'</body></html>','application/msword');
};

$('#bk').onclick=()=>dl('casper-archive-backup.json',JSON.stringify(items),'application/json');
$('#rs').onchange=e=>{
  const f=e.target.files[0];if(!f)return;
  f.text().then(t=>{
    try{
      const d=JSON.parse(t);
      if(Array.isArray(d)&&d.every(x=>x.id&&x.type)){
        items=d;mig();cur=(items.find(i=>i.type=='note')||{}).id||null;save();openNote();tree();
      }else $('#sv').textContent='BAD BACKUP';
    }catch(x){$('#sv').textContent='BAD BACKUP'}
  });
};

if(!note()){const n=items.find(i=>i.type=='note');cur=n?n.id:null}
openNote();tree();
</script>
